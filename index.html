<style>
html,body{margin:0;padding:0}
body{background:var(--bg,#edf0eb)}
#boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg,#edf0eb);color:var(--muted,#5b6a63);font:500 16px/1.4 system-ui,sans-serif;text-align:center;padding:24px}
body.loaded #boot{display:none}
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg,#edf0eb);padding:16px}
#login[hidden]{display:none}
.lcard{width:100%;max-width:360px;background:var(--surface,#fafbf8);border:1px solid var(--line,#d3d9d1);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;font-family:system-ui,sans-serif}
.lcard h1{margin:0 0 4px;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink,#14201c)}
.lcard .lmsg{margin:0 0 8px;color:var(--muted,#5b6a63);font-size:15px}
.lcard label{font-size:13px;font-weight:600;color:var(--muted,#5b6a63)}
.lcard input{font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line,#d3d9d1);background:#fff;color:var(--ink,#14201c)}
.lcard button{margin-top:10px;font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--ink,#14201c);color:#fff;cursor:pointer}
.lcard button:disabled{opacity:.6}

<title>Diário de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: caderno de treino de uma coluna, com navegação fixa na base.
   Tipografia: Barlow Condensed para títulos e números, Barlow para o texto.
   Cor: neutros esverdeados; azul para superior, laranja para inferior. */
:root{
  --bg:#edf0eb; --surface:#fafbf8; --ink:#14201c; --muted:#5b6a63; --line:#d3d9d1; --soft:#e3e8e1;
  --accent:#0f6b58; --accent-ink:#ffffff;
  --upper:#2a5bd0; --upper-bg:#dfe7fa; --lower:#bf4a14; --lower-bg:#f8e2d6;
  --cardio:#0b7f86; --cardio-bg:#d6eeee; --active:#7a6a2e; --active-bg:#efe9d0;
  --ok:#1f8a4c; --ok-bg:#d8efe0; --warn:#b4540a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211d; --ink:#e7eee9; --muted:#9aaba2; --line:#2b3832; --soft:#202c26;
  --accent:#3fbf9f; --accent-ink:#06130f;
  --upper:#8fb0ff; --upper-bg:#1b2a4d; --lower:#ff9a66; --lower-bg:#43251a;
  --cardio:#5fd0d6; --cardio-bg:#143a3d; --active:#d8c57a; --active-bg:#383219;
  --ok:#59d38b; --ok-bg:#15351f; --warn:#f0a15c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211d; --ink:#e7eee9; --muted:#9aaba2; --line:#2b3832; --soft:#202c26;
  --accent:#3fbf9f; --accent-ink:#06130f;
  --upper:#8fb0ff; --upper-bg:#1b2a4d; --lower:#ff9a66; --lower-bg:#43251a;
  --cardio:#5fd0d6; --cardio-bg:#143a3d; --active:#d8c57a; --active-bg:#383219;
  --ok:#59d38b; --ok-bg:#15351f; --warn:#f0a15c; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 96px;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.busy i{background:var(--warn)} .sync.err i{background:var(--lower)}
.banner{background:var(--active-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px}

.daybar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.daybar .mid{text-align:center;min-width:0}
.dow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dnum{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:700}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.today{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:36px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero .tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.hero.g-upper .tag{color:var(--upper)} .hero.g-lower .tag{color:var(--lower)}
.hero.k-cardio .tag{color:var(--cardio)} .hero.k-active .tag{color:var(--active)} .hero.k-rest .tag{color:var(--muted)}
.hero h2{font-size:38px;line-height:1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:6px;padding:3px 8px;font-size:13px;background:var(--soft);color:var(--ink)}
.callout{border-left:3px solid var(--warn);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
.small{font-size:14px;color:var(--muted)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.exh{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;display:block;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb.empty{background:var(--soft);border:1.5px dashed var(--muted);color:var(--muted);font-size:24px;line-height:1}
.exh .target{margin-top:2px}
.how{border-top:1px solid var(--line);padding-top:8px}
.how summary{cursor:pointer;min-height:36px;display:flex;align-items:center;font-weight:600;font-size:15px;color:var(--accent);list-style:none}
.how summary::-webkit-details-marker{display:none}
.how summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s}
.how[open] summary::before{transform:rotate(90deg)}
.how ol{margin:6px 0 8px;padding-left:22px;font-size:15px;line-height:1.45}
.how li{margin-bottom:4px}
.how .avoid{font-size:14px;color:var(--muted);margin:0}
.how .avoid b{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.how summary::before{transition:none}}
.hero.done{background:var(--ok-bg);border-color:var(--ok)}
.hero.done .tag{color:var(--ok);font-size:14px}
.hero.done h2{color:var(--ink)}
.exd{background:var(--ok-bg);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px}
.exd summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) 20px;gap:10px;align-items:center;padding:10px 12px;min-height:56px}
.exd summary::-webkit-details-marker{display:none}
.exd .ck2{width:28px;height:28px;border-radius:50%;background:var(--ok);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.exd .ck2.empty{background:transparent;border:2px solid var(--muted);color:var(--muted)}
.exd .t{display:flex;flex-direction:column;min-width:0}
.exd .t b{font-family:var(--display);font-size:19px;line-height:1.15}
.exd .t small{font-size:14px;color:var(--muted)}
.exd .chev{color:var(--muted);transition:transform .15s}
.exd[open] .chev{transform:rotate(90deg)}
.exd .exbody{padding:0 12px 12px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.lbtn{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;width:100%}
.wcard{display:flex;flex-direction:column;gap:10px}
.witem{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0}
.witem>div{display:flex;flex-direction:column;min-width:0}
.witem span{font-size:14px;color:var(--muted)}
.wform{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.wform .full{grid-column:1/-1}
.wform input,.wform select{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:16px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.hist summary::-webkit-details-marker{display:none}
.hist .hd{font-family:var(--display);font-weight:700;font-size:18px;width:74px;flex:none}
.hist .hn{flex:1;min-width:0;display:flex;flex-direction:column}
.hist .hn b{font-family:var(--display);font-size:20px;line-height:1.15}
.hist .hn small{font-size:13px;color:var(--muted)}
.badge{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--ok-bg);color:var(--ok);white-space:nowrap}
.badge.part{background:var(--active-bg);color:var(--warn)}
.hist .hb{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.hx{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:8px 0 0}
.hx span{font-size:14px;color:var(--muted)}
.prog{display:flex;flex-direction:column;border-top:1px solid var(--line);padding:10px 0}
.prog:first-of-type{border-top:0}
.prog b{font-weight:600}
.prog span{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.hero.pop{animation:pop .5s ease-out}@keyframes pop{0%{transform:scale(.96);opacity:.5}100%{transform:none;opacity:1}}}
.ex h3{font-size:21px;line-height:1.15;min-width:0}
.target{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;color:var(--accent)}
.last{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:8px}
.set .n{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:18px;font-weight:500;text-align:center}
.set .u{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px 12px;resize:vertical}
label.lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

.btn{min-height:48px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px;width:100%;font-size:16px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.done{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.small-btn{width:auto;min-height:44px}

.upnext{display:flex;flex-direction:column;gap:2px}
.upnext h3,.section-h{font-size:20px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:48px}
.row:first-of-type{border-top:0}
.row .d{font-family:var(--display);font-weight:700;font-size:18px;width:78px;flex:none}
.row .w{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.g-upper{background:var(--upper)} .dot.g-lower{background:var(--lower)}
.dot.k-cardio{background:var(--cardio)} .dot.k-active{background:var(--active)} .dot.k-rest{background:var(--line)}

.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{font-size:28px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.gh{font-size:12px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.cell{font:inherit;color:var(--ink);cursor:pointer;aspect-ratio:1/1.12;min-height:54px;border-radius:8px;border:1px solid transparent;background:var(--surface);padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;position:relative;overflow:hidden}
.cell.empty{background:none;border:0;pointer-events:none}
.cell .num{font-family:var(--display);font-weight:700;font-size:17px;line-height:1}
.cell .lab{white-space:nowrap;font-size:10px;font-weight:600;line-height:1.1;text-align:center;letter-spacing:.01em}
.cell.g-upper{background:var(--upper-bg)} .cell.g-upper .lab{color:var(--upper)}
.cell.g-lower{background:var(--lower-bg)} .cell.g-lower .lab{color:var(--lower)}
.cell.k-cardio{background:var(--cardio-bg)} .cell.k-cardio .lab{color:var(--cardio)}
.cell.k-active{background:var(--active-bg)} .cell.k-active .lab{color:var(--active)}
.cell.k-rest,.cell.none{background:var(--surface);color:var(--muted)}
.cell.isToday{border-color:var(--ink);border-width:2px}
.cell.isSel{box-shadow:0 0 0 2px var(--accent)}
.cell .ck{position:absolute;top:3px;right:4px;font-size:11px;color:var(--ok);font-weight:700}
.cell .part{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--display);font-size:34px;line-height:1;display:block}
.stat span{font-size:13px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.tagbtn{min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:14px}
.tagbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.fb:first-child{border-top:0}
.fb .when{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status{border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;background:var(--soft)}
.status.aplicado{background:var(--cardio-bg);color:var(--cardio)}
.reply{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:14px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:8px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:640px}
nav.tabs button{min-height:48px;border-radius:10px;border:0;background:none;font-weight:600;font-size:14px;padding:0 2px;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--soft);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.cell,.btn,.tagbtn,.iconbtn{transition:background .15s,box-shadow .15s}}
.resched{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.resched summary{font-weight:600;cursor:pointer;min-height:32px;display:flex;align-items:center}
.rsbox{display:flex;flex-direction:column;gap:10px;padding-top:10px}
card.rsbox,section.rsbox{padding:14px}
.rsprev{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:15px}
.rsprev div{padding:2px 0}
.rsbox select{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;font-size:16px}
.btn:disabled{opacity:.45}
</style>
</head>

<script>
const DEFAULT_MEDIA = {};
const PLAN_DEFAULT = {"version": 0, "start": "2026-10-30", "cycleStart": "2026-11-02", "weeklyFrom": "2026-11-16", "effort": [{"rir": "RIR 3", "text": ""}], "warmup": "", "workouts": {}, "kinds": {}, "overrides": {}, "weekly": {}, "dayNotes": {}};

const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DOWS=['dom','seg','ter','qua','qui','sex','sáb'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const num=v=>{if(v===''||v==null)return null;const x=Number(String(v).replace(',','.'));return isFinite(x)?x:null};

const today=fmt(new Date());
const state={tab:'treino',sel:today,month:today.slice(0,7),plan:PLAN_DEFAULT,logs:{},feedback:[],db:undefined,sync:'ok',fbDraft:'',fbTags:[],media:{},openHow:{},wDraft:{type:'Musculação',min:'',kcal:'',hrAvg:'',hrMax:''},wMsg:'',wMsgDay:'',wPaste:''};
const dirty={}; // date -> {timer,inflight,again}

/* ---------- plano ---------- */
function slotId(ds){
  const p=state.plan; if(ds<p.start) return null;
  let id=p.overrides[ds];
  if(!id && ds>=p.weeklyFrom) id=p.weekly[String(parse(ds).getDay())];
  return id||null;
}
function info(ds){
  const id=slotId(ds); if(!id) return null;
  const p=state.plan;
  if(p.workouts[id]) return {id,gym:true,w:p.workouts[id],cls:'g-'+p.workouts[id].group,label:p.workouts[id].short};
  const k=p.kinds[id]; return k?{id,gym:false,k,cls:'k-'+id,label:k.short}:null;
}
function effort(ds){
  const p=state.plan;
  if(ds<p.cycleStart) return Object.assign({label:'Adaptação'},p.effort[0]);
  const w=Math.floor(diffDays(ds,p.cycleStart)/7), n=p.effort.length;
  return Object.assign({label:'Semana '+(w%n+1)+' do ciclo '+(Math.floor(w/n)+1)},p.effort[w%n]);
}

/* ---------- registros ---------- */
function fromDoc(d){
  const sets={}; Object.keys(d.sets||{}).forEach(k=>{sets[k]=(d.sets[k]||[]).map(s=>({kg:s.kg==null?'':String(s.kg),reps:s.reps==null?'':String(s.reps)}))});
  return {workout:d.workout||'',done:!!d.done,note:d.note||'',sets,watch:Array.isArray(d.watch)?d.watch:[]};
}
function toDoc(ds,l){
  const sets={}; Object.keys(l.sets).forEach(k=>{sets[k]=l.sets[k].map(s=>({kg:num(s.kg),reps:num(s.reps)}))});
  return {date:ds,workout:l.workout,done:l.done,note:l.note,sets,watch:JSON.parse(JSON.stringify(l.watch||[])),updatedAt:new Date().toISOString()};
}
function getLog(ds){
  if(!state.logs[ds]){const i=info(ds);state.logs[ds]={workout:i?i.id:'',done:false,note:'',sets:{},watch:[]}}
  return state.logs[ds];
}
function hasData(l){return l&&(l.done||l.note||(l.watch&&l.watch.length)||Object.keys(l.sets).some(k=>l.sets[k].some(s=>s.kg!==''||s.reps!=='')))}
function lastFor(exId,ds){
  const dates=Object.keys(state.logs).filter(d=>d<ds).sort().reverse();
  for(const d of dates){
    const arr=state.logs[d].sets[exId]; if(!arr) continue;
    const f=arr.filter(s=>num(s.kg)!=null); if(!f.length) continue;
    const top=f.reduce((a,b)=>num(b.kg)>num(a.kg)?b:a);
    return {date:d,kg:top.kg,reps:top.reps};
  }
  return null;
}
function save(ds){
  if(!state.db){return}
  const e=dirty[ds]||(dirty[ds]={timer:null,inflight:false,again:false});
  clearTimeout(e.timer); state.sync='busy'; paintSync();
  e.timer=setTimeout(()=>flush(ds),600);
}
async function flush(ds){
  const e=dirty[ds]; if(!e) return;
  if(e.inflight){e.again=true;return}
  e.inflight=true; e.again=false;
  try{
    await state.db.doc('logs/'+ds).set(toDoc(ds,state.logs[ds]));
    state.sync='ok';
  }catch(err){state.sync='err'}
  e.inflight=false;
  if(e.again){return flush(ds)}
  if(state.sync!=='err') delete dirty[ds];
  paintSync();
}

  el.innerHTML='<i></i>'+(state.db===null?'Sem salvar':state.sync==='busy'?'Salvando…':state.sync==='err'?'Erro ao salvar':'Salvo');
}

/* render preservando o campo em foco (valor, cursor, rolagem) */
function render(){
  const a=document.activeElement, inApp=a&&a!==document.body&&$app.contains(a)&&a.matches&&a.matches('input,textarea,select');
  const id=inApp?a.id:'', s=inApp&&a.selectionStart!=null?a.selectionStart:null, e=inApp&&a.selectionEnd!=null?a.selectionEnd:null, v=inApp?a.value:null;
  state.pendingRender=false;
  render0();
  if(id){const n=document.getElementById(id); if(n){ if(v!=null&&n.value!==v&&n.tagName!=='SELECT')n.value=v; try{n.focus({preventScroll:true}); if(s!=null&&n.setSelectionRange)n.setSelectionRange(s,e)}catch(x){} }}
}
/* atualização vinda do banco: se o usuário está digitando, adia o redesenho até sair do campo */
function typing(){const a=document.activeElement; return !!(a&&a!==document.body&&$app.contains(a)&&a.matches&&a.matches('input,textarea,select'))}
function softRender(){ if(typing()){state.pendingRender=true;return} render() }
document.addEventListener('focusout',()=>{ if(!state.pendingRender) return; setTimeout(()=>{ if(state.pendingRender&&!typing()) render() },250) });

function dayTitle(ds){
  const d=parse(ds);
  return '<div class="dow">'+DOW[d.getDay()]+'</div><div class="dnum">'+d.getDate()+' de '+MONTHS[d.getMonth()]+'</div>';
}
function upcoming(from,n){
  const out=[]; let d=from>state.plan.start?from:state.plan.start;
  for(let i=0;i<120&&out.length<n;i++,d=addDays(d,1)){
    const x=info(d); if(x&&x.id!=='rest'&&d>=from&&!(state.logs[d]&&state.logs[d].done)) out.push([d,x]);
  }
  return out;
}
function nextList(from,title){
  const L=upcoming(from,5); if(!L.length) return '';
  return '<section class="card upnext"><h3>'+title+'</h3>'+L.map(([d,x])=>
    '<button class="row" data-date="'+d+'"><span class="d">'+DOWS[parse(d).getDay()]+' '+short(d)+'</span><span class="w">'+esc(x.gym?x.w.name+' · '+x.w.focus:x.k.name)+'</span><span class="dot '+x.cls+'"></span></button>').join('')+'</section>';
}

  }else{
    h+='<section class="card hero '+x.cls+'"><div class="tag">'+esc(ef.label)+'</div><h2>'+esc(w.name)+'</h2>'+
       '<div class="small">'+esc(w.focus)+'</div><div class="meta"><span class="chip">'+esc(w.minutes)+'</span><span class="chip">'+esc(ef.rir)+'</span><span class="chip">'+w.exercises.length+' exercícios</span></div>'+

    if(note) h+='<div class="callout">'+esc(note)+'</div>';
    h+='<p class="small" style="margin:0">'+esc(state.plan.warmup)+'</p>';
  }

/* ---------- resumo e histórico ---------- */
function setsText(arr){
  const a=(arr||[]).filter(s=>s.kg!==''||s.reps!==''); if(!a.length) return '';
  const same=a.length>1&&a.every(s=>s.kg===a[0].kg&&s.reps===a[0].reps);
  if(same) return a.length+' × '+(a[0].reps!==''?a[0].reps:'–')+(a[0].kg!==''?' com '+a[0].kg+' kg':'');
  return a.map(s=>(s.kg!==''?s.kg+' kg':'– kg')+(s.reps!==''?' × '+s.reps:'')).join(' · ');
}
function sessStats(l){
  let sets=0,vol=0,ex=0;
  Object.keys(l.sets).forEach(k=>{let c=0;l.sets[k].forEach(s=>{if(s.kg!==''||s.reps!==''){sets++;c++;const a=num(s.kg),b=num(s.reps);if(a!=null&&b!=null)vol+=a*b}});if(c)ex++});
  return {sets,vol,ex};
}
function volText(v){return v>=1000?(v/1000).toFixed(1).replace('.',',')+' t':Math.round(v)+' kg'}
function exName(id){const ws=state.plan.workouts;for(const k in ws){const e=ws[k].exercises.find(q=>q.id===id);if(e)return e.name}return id}
function kgText(v){return String(v).replace('.',',')}
function viewHist(){
  const ds=Object.keys(state.logs).filter(d=>hasData(state.logs[d])).sort().reverse();
  let h='<h2 class="section-h" style="font-size:30px;margin:0">Histórico</h2>';
  if(!ds.length) return h+'<section class="card"><p class="small" style="margin:0">Quando você registrar o primeiro treino, ele aparece aqui.</p></section>';
  let tot=0,vol=0,doneN=0,wSec=0,wKcal=0;
  ds.forEach(d=>{const l=state.logs[d],s=sessStats(l);tot+=s.sets;vol+=s.vol;if(l.done)doneN++;const wt0=wTotals(l);wSec+=wt0.sec;wKcal+=wt0.kcal});
  h+='<div class="stats3"><div class="stat"><b>'+doneN+'</b><span>treinos concluídos</span></div><div class="stat"><b>'+tot+'</b><span>séries registradas</span></div><div class="stat"><b>'+volText(vol)+'</b><span>volume total</span></div></div>'+(wSec||wKcal?'<div class="stats"><div class="stat"><b>'+(wSec?fmtDur(wSec):'–')+'</b><span>tempo de atividade no relógio</span></div><div class="stat"><b>'+(wKcal||'–')+'</b><span>calorias (kcal) no relógio</span></div></div>':'');
  h+='<div style="display:flex;flex-direction:column;gap:10px">'+ds.map(d=>{
    const l=state.logs[d], i=info(d), wk=state.plan.workouts[l.workout], s=sessStats(l);
    const name=wk?wk.name:(i?(i.gym?i.w.name:i.k.name):'Sessão');
    const wt=wTotals(l); const wl=(l.watch||[]).map(w=>'<div class="hx"><b>'+esc(w.title||'Atividade')+'</b><span>'+esc(wLine(w))+'</span></div>').join(''); const keys=Object.keys(l.sets); const order=wk?wk.exercises.map(e=>e.id).filter(k=>keys.includes(k)):keys;
    const rows=order.map(k=>{const t=setsText(l.sets[k]);return t?'<div class="hx"><b>'+esc(exName(k))+'</b><span>'+esc(t)+'</span></div>':''}).join('');
    return '<details class="hist" data-hist="'+d+'"'+(state.openHow['d:'+d]?' open':'')+'><summary><span class="hd">'+DOWS[parse(d).getDay()]+' '+short(d)+'</span>'+
      '<span class="hn"><b>'+esc(name)+'</b><small>'+(s.sets?s.sets+' séries'+(s.vol?' · '+volText(s.vol):''):'sem cargas')+(wt.sec?' · '+fmtDur(wt.sec):'')+(wt.kcal?' · '+wt.kcal+' kcal':'')+'</small></span>'+
      '<span class="badge'+(l.done?'':' part')+'">'+(l.done?'✓ Concluído':'Em andamento')+'</span></summary>'+
      '<div class="hb">'+rows+wl+(l.note?'<p class="small" style="margin:6px 0 0">Obs.: '+esc(l.note)+'</p>':'')+'<button class="linkbtn" style="align-self:flex-start" data-date="'+d+'">Abrir este dia</button></div></details>';
  }).join('')+'</div>';
  // evolução de carga por exercício
  const ev={};
  ds.slice().reverse().forEach(d=>{const l=state.logs[d];Object.keys(l.sets).forEach(k=>{
    const f=l.sets[k].filter(s=>num(s.kg)!=null); if(!f.length) return;
    const top=f.reduce((a,b)=>num(b.kg)>num(a.kg)?b:a); const nm=exName(k);
    (ev[nm]=ev[nm]||[]).push({d:d,kg:num(top.kg),reps:top.reps});
  })});
  const names=Object.keys(ev).sort((a,b)=>a.localeCompare(b,'pt'));
  if(names.length){
    h+='<section class="card"><h3 class="section-h">Evolução das cargas</h3><p class="small" style="margin:0 0 6px">Maior carga de cada treino, do primeiro ao mais recente.</p>'+names.map(nm=>{
      const a=ev[nm], f=a[0], z=a[a.length-1], best=a.reduce((m,x)=>x.kg>m.kg?x:m);
      const arrow=a.length>1?(z.kg>f.kg?' ↑':z.kg<f.kg?' ↓':' ='):'';
      return '<div class="prog"><b>'+esc(nm)+'</b><span>'+(a.length>1?kgText(f.kg)+' kg ('+short(f.d)+') → '+kgText(z.kg)+' kg ('+short(z.d)+')'+arrow+' · melhor '+kgText(best.kg)+' kg':kgText(z.kg)+' kg ('+short(z.d)+') · só 1 registro')+'</span></div>';
    }).join('')+'</section>';
  }
  return h;
}

function viewCal(){
  const [y,m]=state.month.split('-').map(Number);
  const first=new Date(y,m-1,1), lead=(first.getDay()+6)%7, days=new Date(y,m,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++) cells+='<div class="cell empty"></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(m)+'-'+pad(d), x=info(ds), l=state.logs[ds];
    const cls=['cell',x?x.cls:'none',ds===today?'isToday':'',ds===state.sel?'isSel':''].join(' ');
    cells+='<button class="'+cls+'" data-date="'+ds+'" aria-label="'+d+' de '+MONTHS[m-1]+(x?', '+esc(x.gym?x.w.name:x.k.name):'')+'">'+
      '<span class="num">'+d+'</span><span class="lab">'+esc(x?x.label:'')+'</span>'+
      (l&&l.done?'<span class="ck">✓</span>':(hasData(l)?'<span class="part"></span>':''))+'</button>';
  }
  // estatísticas até hoje
  let planned=0,done=0,doneAny=0;
  for(let d=state.plan.start;d<=today;d=addDays(d,1)){
    const x=info(d); if(x&&x.gym){planned++;if(state.logs[d]&&state.logs[d].done)done++}
    if(state.logs[d]&&state.logs[d].done)doneAny++;
  }
  const monthName=MONTHS[m-1]+' '+y;
  return '<div class="calhead"><button class="iconbtn" data-month="-1" aria-label="Mês anterior">‹</button><h2>'+monthName+'</h2><button class="iconbtn" data-month="1" aria-label="Próximo mês">›</button></div>'+
    '<div class="grid">'+['seg','ter','qua','qui','sex','sáb','dom'].map(t=>'<div class="gh">'+t+'</div>').join('')+cells+'</div>'+
    '<div class="legend"><span><i class="dot g-upper"></i>Superior</span><span><i class="dot g-lower"></i>Inferior</span><span><i class="dot k-cardio"></i>Cardio</span><span><i class="dot k-active"></i>Descanso ativo</span><span>✓ concluído</span><span><i class="dot" style="background:var(--warn);width:6px;height:6px"></i>em andamento</span></div>'+
    '<div class="stats"><div class="stat"><b>'+done+' de '+planned+'</b><span>treinos de força concluídos até hoje</span></div><div class="stat"><b>'+doneAny+'</b><span>sessões marcadas como feitas</span></div></div>'+
    nextList(today,'Próximos treinos');
}

function paintFbList(){
  const el=document.getElementById('fblist'); if(!el) return;
  if(!state.feedback.length){el.innerHTML='<p class="small" style="margin:0">Nenhum feedback ainda. O primeiro que você enviar aparece aqui.</p>';return}
  el.innerHTML=state.feedback.map(f=>{

function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const S=128, c=document.createElement('canvas'); c.width=S; c.height=S;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,S,S);
      const r=Math.min(S/im.width,S/im.height), w=im.width*r, h=im.height*r;
      x.drawImage(im,(S-w)/2,(S-h)/2,w,h); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}

/* ---------- relógio (Garmin) ---------- */
function setW(m){state.wMsg=m;state.wMsgDay=state.sel}
function wTotals(l){let sec=0,kcal=0;(l.watch||[]).forEach(w=>{if(w.durSec)sec+=w.durSec;if(w.kcal)kcal+=w.kcal});return {sec,kcal}}
function fmtDur(s){s=Math.round(s);if(s>=3600){const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h+'h'+pad(m)}return Math.max(1,Math.round(s/60))+' min'}
function mmss(s){s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)}
function wLine(w){
  const p=[];
  if(w.kind==='forca'){p.push(w.sets+' séries','cerca de '+w.reps+' reps');if(w.restAvgSec)p.push('descanso médio '+mmss(w.restAvgSec))}
  else{
    if(w.distKm)p.push(String(w.distKm).replace('.',',')+' km');
    if(w.durSec)p.push(fmtDur(w.durSec));
    if(w.pace&&w.pace!=='--')p.push(w.pace+' min/km');
  }
  if(w.hrAvg)p.push('FC '+w.hrAvg+(w.hrMax?' (máx '+w.hrMax+')':'')+' bpm'); else if(w.hrMax)p.push('FC máx '+w.hrMax+' bpm');
  if(w.kcal)p.push(w.kcal+' kcal');
  return p.join(' · ');
}
function watchCard(ds,l){

    '<div class="full"><button class="btn" data-act="addw">Adicionar</button></div></div></details>'+
    '<details class="how" data-wopen="2"'+(state.openHow['w:2']?' open':'')+'><summary>Colar o texto do CSV</summary><div style="display:flex;flex-direction:column;gap:10px;padding-top:8px"><textarea data-wpaste placeholder="Abra o arquivo CSV, copie todo o conteúdo e cole aqui">'+esc(state.wPaste)+'</textarea><button class="btn" data-act="pastew">Importar texto colado</button></div></details></section>';
  return h;

function parseCSV(s){
  s=s.replace(/^﻿/,''); const rows=[]; let r=[],c='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true; else if(ch===','){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;r.push(c);c='';rows.push(r);r=[]}
    else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.length>1);
}
function parseDur(v){
  if(v==null)return null; const p=String(v).trim().split(':').map(Number);
  if(!p.length||p.some(x=>!isFinite(x)))return null;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];
}
function parseGarmin(text,name){
  const rows=parseCSV(text); if(rows.length<2)return null;
  const H=rows[0], col=n=>H.indexOf(n), src=name||'';
  if(col('Voltas')>=0&&col('FC Média bpm')>=0){
    const r=rows.find(x=>x[0]==='Resumo')||rows[rows.length-1], g=n=>{const i=col(n);return i>=0?r[i]:null};
    return {kind:'cardio',title:'Corrida / caminhada',src:src,durSec:parseDur(g('Tempo')),distKm:num(g('Distância km')),pace:g('Ritmo médio min/km'),hrAvg:num(g('FC Média bpm')),hrMax:num(g('FC máxima bpm')),kcal:num(g('Calorias Cal.'))};
  }
  if(col('Definir')>=0&&col('Repetições')>=0){
    const data=rows.slice(1).filter(x=>/^\d+$/.test(x[0])); if(!data.length)return null;
    const iT=col('Tempo'),iD=col('Descanso'),iR=col('Repetições'); let reps=0,act=0; const rest=[];
    data.forEach(x=>{reps+=num(x[iR])||0;act+=parseDur(x[iT])||0;const d=parseDur(x[iD]);if(d!=null&&d>=10)rest.push(d)});
    return {kind:'forca',title:'Séries (contagem do relógio)',src:src,sets:data.length,reps:reps,activeSec:Math.round(act),restAvgSec:rest.length?Math.round(rest.reduce((a,b)=>a+b,0)/rest.length):null};
  }
  return null;
}
document.getElementById('garminpick').addEventListener('change',async e=>{

  setW(ok?('Importado: '+ok+(ok===1?' atividade':' atividades')+(ks.length?' (dia '+ks.join(', ')+')':'')+(bad?'. '+bad+' arquivo(s) não reconhecido(s).':'.')):'Não reconheci esse arquivo. Use o ZIP ou o FIT da atividade no Garmin Connect.');

/* ---------- reagendar ---------- */
state.rs=null; state.rsErr='';
function rsIsDone(d){return !!(state.logs[d]&&state.logs[d].done)}
function rsName(id){const p=state.plan; if(p.workouts[id]) return p.workouts[id].name; const k=p.kinds[id]; return k?k.name:'Descanso'}
function rsDay(d){return DOWS[parse(d).getDay()]+' '+short(d)}
function rsCompute(rs){
  const ds=rs.ds, a=slotId(ds)||'rest', ch=[];
  if(rs.mode==='skip'){ch.push([ds,'rest',a]);return {ch}}
  if(rs.mode==='push'){
    ch.push([ds,'rest',a]); let carry=a, d=ds;
    for(let i=0;i<21;i++){
      d=addDays(d,1); if(rsIsDone(d)) continue;
      const cur=slotId(d)||'rest'; ch.push([d,carry,cur]);
      if(!state.plan.workouts[cur]) return {ch};
      carry=cur;
    }
    return {ch:[],err:'Não achei um dia livre nas próximas semanas para absorver a mudança.'};
  }
  if(rs.mode==='swap'){
    const t=rs.target; if(!t) return {ch:[]};
    const b=slotId(t)||'rest'; ch.push([ds,b,a],[t,a,b]); return {ch};
  }
  return {ch:[]};
}
function rsLines(ch){
  return ch.map(([d,nw,old])=>'<div><b>'+rsDay(d)+'</b>: '+esc(rsName(nw))+(old&&old!==nw?' <span class="small">(era '+esc(rsName(old))+')</span>':'')+'</div>').join('');
}
function rsTargets(ds){
  const out=[]; let d=today;
  for(let i=0;i<28;i++,d=addDays(d,1)){
    if(d===ds||rsIsDone(d)) continue;
    if(!slotId(d)) continue;
    out.push(d);
  }
  return out;
}
function reschedCard(ds){
  const x=info(ds); if(!x||x.id==='rest'||rsIsDone(ds)) return '';
  const past=ds<today, rs=state.rs&&state.rs.ds===ds?state.rs:null;
  let h='<details class="how resched" data-wopen="r"'+((state.openHow['w:r']||rs)?' open':'')+'><summary>Não vai dar para treinar? Reagendar</summary><div class="rsbox">';
  if(!rs){
    h+='<button class="btn ghost" data-rs="skip">'+(past?'Marcar como descanso':ds===today?'Pular hoje':'Pular este dia')+'</button>';
    if(!past){
      h+='<button class="btn ghost" data-rs="push">'+(ds===today?'Empurrar para amanhã':'Empurrar para o dia seguinte')+'</button>'+
         '<button class="btn ghost" data-rs="swap">Trocar com outro dia</button>';
    }
    h+='<p class="small" style="margin:0">'+(past?'Este dia já passou e ficou sem registro. Você pode marcá-lo como descanso.':'O treino pulado vira descanso. Antes de aplicar, você vê o que muda.')+'</p>';
  }else{
    const titles={skip:past?'Marcar como descanso':'Pular este treino',push:'Empurrar para o dia seguinte',swap:'Trocar com outro dia'};
    h+='<div><b>'+titles[rs.mode]+'</b></div>';
    if(rs.mode==='swap'){
      h+='<label class="lbl" for="rstarget">Trocar com</label><select id="rstarget" data-rstarget><option value="">Escolha o dia…</option>'+
        rsTargets(ds).map(d=>'<option value="'+d+'"'+(rs.target===d?' selected':'')+'>'+rsDay(d)+' · '+esc(rsName(slotId(d)))+'</option>').join('')+'</select>';
    }
    const c=rsCompute(rs);
    if(c.err) h+='<div class="callout">'+esc(c.err)+'</div>';
    else if(c.ch.length) h+='<div class="rsprev">'+rsLines(c.ch)+'</div>';
    if(state.rsErr) h+='<div class="callout">'+esc(state.rsErr)+'</div>';
    h+='<button class="btn" data-rs="ok"'+(c.ch.length?'':' disabled')+'>Confirmar</button><button class="btn ghost" data-rs="cancel">Cancelar</button>';
  }
  return h+'</div></details>';
}
function restoreCard(ds){
  const sk=(state.plan.skips||{})[ds]; if(!sk||slotId(ds)!=='rest'||rsIsDone(ds)) return '';
  return '<section class="card rsbox"><div>Este dia era <b>'+esc(rsName(sk.id))+'</b> e foi marcado como descanso.</div><button class="btn ghost" data-rs="restore">Voltar a treinar neste dia</button></section>';
}
async function rsCommit(ch,extra){
  const p=state.plan; p.overrides=p.overrides||{}; p.skips=p.skips||{}; p.dayNotes=p.dayNotes||{};
  ch.forEach(([d,nw])=>{
    p.overrides[d]=nw; delete p.skips[d];
    const l=state.logs[d]; if(l&&!l.done){l.workout=nw==='rest'?'':nw; save(d)}
  });
  if(extra) extra(p);
  p.version=(p.version||0)+1;
  if(!state.db){state.rsErr='Sem conexão com o banco: a mudança não foi salva.';return false}
  try{await state.db.doc('plan/current').set(JSON.parse(JSON.stringify(p)));return true}
  catch(err){state.sync='err';state.rsErr='Não consegui salvar a mudança. Tente de novo.';paintSync();return false}
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-rs]'); if(!t) return;
  const a=t.dataset.rs, ds=state.sel;
  if(a==='skip'||a==='push'||a==='swap'){state.rs={ds,mode:a,target:''};state.rsErr='';state.openHow['w:r']=1;render();return}
  if(a==='cancel'){state.rs=null;state.rsErr='';render();return}
  if(a==='restore'){
    const sk=(state.plan.skips||{})[ds]; if(!sk) return;
    const ok=await rsCommit([[ds,sk.id]],p=>{
      if(sk.note&&p.dayNotes[ds]){const n=p.dayNotes[ds].replace(sk.note,'').trim(); if(n) p.dayNotes[ds]=n; else delete p.dayNotes[ds]}
    });
    render(); return;
  }
  if(a==='ok'&&state.rs){
    const rs=state.rs, c=rsCompute(rs); if(!c.ch.length) return;
    const old=slotId(rs.ds)||'rest', note='Treino pulado: '+rsName(old)+'.';
    const ok=await rsCommit(c.ch,rs.mode==='skip'?(p=>{
      p.skips[rs.ds]={id:old,note};
      p.dayNotes[rs.ds]=p.dayNotes[rs.ds]?p.dayNotes[rs.ds]+' '+note:note;
    }):null);
    if(ok){state.rs=null;state.rsErr='';delete state.openHow['w:r']}
    render(); return;
  }
});
document.addEventListener('change',e=>{

render();
(async()=>{

  function again(){try{Object.keys(dirty).forEach(function(ds){var e=dirty[ds];if(e&&!e.inflight&&state.sync==='err')flush(ds)})}catch(x){}}
  window.addEventListener('online',again); setInterval(again,15000);
  setTimeout(function(){var b=document.getElementById('boot');if(b&&!document.body.classList.contains('loaded'))b.querySelector('p').textContent='Sem dados ainda. Confira a conexão e se o banco já recebeu o plano (arquivo seed.sql).'},9000);
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
